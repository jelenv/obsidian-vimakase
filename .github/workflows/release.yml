name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check manifest matches the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          manifest=$(node -p "require('./manifest.json').version")
          pkg=$(node -p "require('./package.json').version")
          versions=$(node -p "require('./versions.json')['${tag}'] ?? ''")
          [ "$manifest" = "$tag" ] || { echo "manifest.json says $manifest, tag is $tag"; exit 1; }
          [ "$pkg" = "$tag" ] || { echo "package.json says $pkg, tag is $tag"; exit 1; }
          [ -n "$versions" ] || { echo "versions.json has no entry for $tag"; exit 1; }

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
